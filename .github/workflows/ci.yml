name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: zig fmt --check
        run: zig fmt --check .
      # The provider host tool: the vendored contract 1.6.0 decoder and its
      # fixtures and tests, providers/ios.json (signing included), the
      # build_options env_file, Info.plist, simctl/devicectl parsing and device
      # choice, doctor against a fake Xcode, the pbxproj snapshot, device
      # signing with fake tools (POSIX), the .app/.ipa layout, the zip writer
      # and the launch supervision (POSIX).
      - name: Build and test the provider tool
        run: zig build install-provider test --summary all
      # labelle-cli#446: the built tool's stdout+stderr redirected to one FILE
      # the "CLI" already wrote to must append, not overwrite from offset 0.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Redirected stdio appends (labelle-cli#446)
        shell: bash
        run: |
          tool=zig-out/bin/labelle-ios
          if [ "$RUNNER_OS" = Windows ]; then tool="$tool.exe"; fi
          python tests/provider/stdio_e2e.py --tool "$tool"

  # The provider through the real labelle-cli, on every host: discovery from a
  # fixture project's `local:` pin (the `ios` namespace needs CLI 4.0), the
  # `zig build --system install-provider` build, the negotiated context, the
  # hooks behind `labelle build|run|bundle --platform=ios` and the
  # `labelle ios doctor|devices|xcode|run` commands against a fake assembler
  # and fake Xcode tools that log their argv (tests/provider/e2e.py). On
  # Windows the launch hook must refuse (the simulator needs macOS). A device
  # build runs end to end on a CLI with contract 1.6.0 (build_options,
  # labelle-cli#522); v4.0.0 speaks 1.5.0, so there it is checked for the
  # upgrade refusal. Bump the ref to the release carrying #522.
  provider:
    name: Provider e2e, fake xcrun (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # labelle-cli v4.0.0: the `ios` namespace unreserved (RFC #471 I5).
      - uses: actions/checkout@v4
        with:
          repository: labelle-toolkit/labelle-cli
          ref: v4.0.0
          path: .test-cli
          persist-credentials: false
      # bash: PowerShell splits `-Dversion=4.0.0` at the dot.
      - run: zig build -Dversion=4.0.0
        shell: bash
        working-directory: .test-cli
      - name: Exercise discovery, the app hook, launch and bundle
        shell: bash
        run: |
          zig_bin="$(command -v zig)"
          cli_bin=.test-cli/zig-out/bin/labelle
          if [ "$RUNNER_OS" = Windows ]; then
            zig_bin="$(cygpath -w "$zig_bin")"
            cli_bin="$cli_bin.exe"
          fi
          python tests/provider/e2e.py --cli "$cli_bin" --zig "$zig_bin"

  # A real sokol app on a real iOS simulator: the pinned CLI, the released
  # assembler (0.120.0, `describe` for CLI 4.0) and sokol backend (v0.8.1) build tests/ios with a clean
  # HOME; this provider wraps the .app, boots a simulator, installs and runs it
  # (`simctl launch --console-pty`) until `--timeout` stops it. Asserts the
  # fixture's log lines and a non-blank screenshot showing its rectangle
  # (tests/ios/sim_e2e.py).
  simulator:
    name: Real iOS simulator (sokol fixture)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Show the Xcode toolchain and simulator runtimes
        run: |
          set -euo pipefail
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-path
          xcrun simctl list runtimes
      - uses: actions/checkout@v4
        with:
          repository: labelle-toolkit/labelle-cli
          ref: v4.0.0
          path: .test-cli
          persist-credentials: false
      - run: zig build -Dversion=4.0.0
        shell: bash
        working-directory: .test-cli
      - name: Build, launch, screenshot
        run: python tests/ios/sim_e2e.py --cli .test-cli/zig-out/bin/labelle --out "$RUNNER_TEMP/sim"
      - name: Upload the run log and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-run
          path: ${{ runner.temp }}/sim
          if-no-files-found: warn
